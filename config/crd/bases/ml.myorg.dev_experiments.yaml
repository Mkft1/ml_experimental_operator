---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: experiments.ml.myorg.dev
spec:
  group: ml.myorg.dev
  names:
    kind: Experiment
    listKind: ExperimentList
    plural: experiments
    shortNames:
    - exp
    singular: experiment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.search.strategy
      name: Strategy
      type: string
    - jsonPath: .status.trials.total
      name: Trials
      type: integer
    - jsonPath: .status.trials.running
      name: Running
      type: integer
    - jsonPath: .status.trials.succeeded
      name: Succeeded
      type: integer
    - jsonPath: .status.trials.failed
      name: Failed
      type: integer
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Experiment — ML-эксперимент с поиском гиперпараметров.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExperimentSpec — желаемое состояние эксперимента.
            properties:
              command:
                description: Command — команда запуска обучения. Аргументы гиперпараметров
                  подставляет оператор.
                items:
                  type: string
                type: array
              dataset:
                description: Dataset — PVC с датасетом (монтируется read-only).
                properties:
                  claimName:
                    description: ClaimName — имя существующего PVC.
                    type: string
                required:
                - claimName
                type: object
              earlyStopping:
                description: EarlyStopping — ранняя остановка trials (опционально).
                properties:
                  metric:
                    description: Metric — имя отслеживаемой метрики (например "val_loss").
                    type: string
                  minDelta:
                    description: MinDelta — минимальная положительная дельта, считаемая
                      улучшением.
                    type: string
                  patience:
                    description: Patience — сколько эпох без улучшения терпим.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - metric
                type: object
              image:
                description: Image — контейнер с обучением (например "myorg/ml-trainer:v1").
                type: string
              maxRetries:
                description: MaxRetries — сколько раз перезапускать упавший trial.
                format: int32
                minimum: 0
                type: integer
              output:
                description: Output — PVC и путь для артефактов/метрик.
                properties:
                  path:
                    description: Path — путь внутри смонтированного PVC (например
                      "/output").
                    type: string
                  pvc:
                    description: PVC — claim для артефактов.
                    properties:
                      claimName:
                        description: ClaimName — имя существующего PVC.
                        type: string
                    required:
                    - claimName
                    type: object
                required:
                - path
                - pvc
                type: object
              priority:
                description: Priority — приоритет планирования экспериментов (больше
                  = важнее).
                format: int32
                minimum: 0
                type: integer
              resources:
                description: Resources — ресурсы на каждый trial.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPU — запрос/лимит CPU (например "2" или "500m").
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  gpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: GPU — количество GPU (целое, например 1).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory — запрос/лимит памяти (например "4Gi").
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              search:
                description: Search — конфигурация поиска гиперпараметров.
                properties:
                  maxParallel:
                    description: MaxParallel — максимум одновременно запущенных trials.
                    format: int32
                    minimum: 1
                    type: integer
                  maxTrials:
                    description: MaxTrials — максимальное число trials в эксперименте.
                    format: int32
                    minimum: 1
                    type: integer
                  parameters:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: |-
                      Parameters — пространство поиска: имя гиперпараметра -> список кандидатов.
                      Пример: {"lr": ["0.01","0.1"], "dropout": ["0.2","0.5"]}
                    type: object
                  strategy:
                    description: 'Strategy — стратегия поиска: grid или random.'
                    enum:
                    - grid
                    - random
                    type: string
                required:
                - maxParallel
                - maxTrials
                - strategy
                type: object
            required:
            - dataset
            - image
            - search
            type: object
            x-kubernetes-validations:
            - message: maxParallel must be <= maxTrials
              rule: self.maxParallel <= self.maxTrials
          status:
            description: ExperimentStatus — фактическое состояние эксперимента.
            properties:
              bestTrial:
                description: BestTrial — лучший trial эксперимента.
                properties:
                  hyperparameters:
                    additionalProperties:
                      type: string
                    description: Hyperparameters — гиперпараметры лучшего trial.
                    type: object
                  metrics:
                    additionalProperties:
                      type: number
                    description: Metrics — значения метрик лучшего trial.
                    type: object
                  name:
                    description: Name — имя лучшего Trial.
                    type: string
                type: object
              conditions:
                description: Conditions — стандартные условия Kubernetes.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                allOf:
                - enum:
                  - Pending
                  - Running
                  - Succeeded
                  - Failed
                - enum:
                  - Pending
                  - Running
                  - Succeeded
                  - Failed
                description: Phase — текущая фаза эксперимента.
                type: string
              trials:
                description: Trials — счётчики trials по состояниям.
                properties:
                  failed:
                    description: Failed — неуспешно завершённые trials.
                    format: int32
                    type: integer
                  pending:
                    description: Pending — ожидающие запуска trials.
                    format: int32
                    type: integer
                  running:
                    description: Running — запущенные trials.
                    format: int32
                    type: integer
                  succeeded:
                    description: Succeeded — успешно завершённые trials.
                    format: int32
                    type: integer
                  total:
                    description: Total — всего созданных trials.
                    format: int32
                    type: integer
                required:
                - failed
                - pending
                - running
                - succeeded
                - total
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
